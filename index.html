
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry World</title>
    <link rel="icon" href="world_favicon.png">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <script>
        fetch("world_25_embed.html")
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Failed to load HTML: ${response.status}`);
                }
                return response.text();
            })
            .then(html => {
                const iframe = document.createElement("iframe");
                iframe.src = "";
                document.body.appendChild(iframe);
                const doc = iframe.contentDocument;
                doc.open();
                doc.write(html);
                doc.close();
            })
            .catch(error => {
                console.error("Error loading Geometry World:", error);
            });
    </script>
</body>
</html>
